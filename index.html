<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blast Quoting Spaceship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f4;--panel:#fff;--ink:#14202a;--mute:#66757f;--line:#e1e7ea;--field:#f6f8f9;--quote:#7ef7fc;--quote-ink:#06272b;--accent:#a3cc39;--accent-ink:#14202a;--shadow:0 1px 2px rgba(20,32,42,.06),0 4px 14px rgba(20,32,42,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1316;--panel:#171e22;--ink:#e9eff1;--mute:#8f9fa6;--line:#27333a;--field:#1e272c;--quote:#12474c;--quote-ink:#dcfdff;--accent:#a3cc39;--accent-ink:#14202a;--shadow:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0e1316;--panel:#171e22;--ink:#e9eff1;--mute:#8f9fa6;--line:#27333a;--field:#1e272c;--quote:#12474c;--quote-ink:#dcfdff;--accent:#a3cc39;--accent-ink:#14202a;--shadow:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Lato,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1100px;margin:0 auto;padding:32px 16px 56px}
.logo{display:flex;justify-content:center;margin:0 0 24px}
.logo img{display:block;width:100%;max-width:340px;height:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo img{background:#fff;padding:12px 18px;border-radius:12px}}
:root[data-theme="dark"] .logo img{background:#fff;padding:12px 18px;border-radius:12px}
.rates{display:flex;gap:16px;flex-wrap:wrap;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:16px 20px;margin-bottom:16px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--mute)}
input{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);padding:8px 10px;border-radius:8px;width:100%;transition:border-color .15s,box-shadow .15s}
input:hover{border-color:var(--mute)}
input:focus-visible,button:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
.rates input{width:130px}
.rates .notes{flex:1 1 220px}
.rates .notes input{width:100%}
.scroll{overflow-x:auto;background:var(--panel);border-radius:12px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:900px}
th{font-size:12.5px;text-align:left;color:var(--mute);font-weight:600;padding:12px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
th.num{text-align:right}
td{padding:8px 10px;border-bottom:1px solid var(--line)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
td input.n{width:84px}
td input.f{min-width:140px}
td input.m{min-width:270px}
tfoot td{font-weight:700;border-bottom:0;background:var(--field)}
button{font:inherit;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;transition:background .15s,border-color .15s}
button:hover{border-color:var(--mute)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.08)}
.x{padding:4px 10px;color:var(--mute);border-color:transparent;background:transparent}
.x:hover{color:var(--ink);background:var(--field);border-color:transparent}
.bar{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.quote{background:var(--panel);color:var(--ink);padding:14px 20px 10px;border-radius:12px;box-shadow:var(--shadow)}
.quote p{margin:0 0 6px;word-break:break-word}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.qhead h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--accent-ink);background:var(--accent);padding:7px 16px;border-radius:8px}
.qhead button{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qhead button:hover{filter:brightness(1.08)}
.sheetwrap{margin-top:28px}
.sheetwrap table{min-width:700px}
.sheetwrap td{white-space:nowrap}
.sheetwrap td:nth-child(6){white-space:normal}
</style>
</head>

<div class="qhead"><h2>MATERIAL AND PRICING CALCULATOR</h2></div>

<div class="rates">
  <label>Material price per sqft ($)<input id="priceRate" type="number" step="any" min="0" value="0"></label>
  <label>Install price per sqft ($)<input id="installRate" type="number" step="any" min="0" value="0"></label>
  <label class="notes">Notes (ie: + Taxes)<input id="taxNote" type="text" value="+ taxes"></label>
</div>

<div class="scroll">
<table>
  <thead><tr>
    <th>Artwork file name</th><th>Width (in)</th><th>Height (in)</th><th>QTY</th>
    <th class="num">Sqft</th><th>Material</th><th class="num">Price</th><th class="num">Install</th><th></th>
  </tr></thead>
  <tbody id="rows"></tbody>
  <tfoot><tr><td colspan="4">Totals</td><td class="num" id="tSqft"></td><td></td><td class="num" id="tPrice"></td><td class="num" id="tInstall"></td><td></td></tr></tfoot>
</table>
</div>

<div class="bar"><button class="primary" id="add">Add row</button><button id="reset">Start over</button></div>

<div class="sheetwrap quotewrap">
  <div class="qhead"><h2>QUOTING</h2><button id="copy">Copy quote</button></div>
  <div class="quote"><div id="lines"></div></div>
</div>

<div class="sheetwrap">
  <div class="qhead"><h2>DOCKET INFO</h2><button id="copyTable">Copy table</button></div>
  <div class="scroll"><table id="sheet"><thead></thead><tbody></tbody></table></div>
</div>
</main>

<script>
(function(){
  var KEY="quote-calc-v2";
  var DEFAULT_MAT="Material description";
  function fresh(){return {price:0,install:0,tax:"+ taxes",rows:[{file:"artwork1.pdf",w:0,h:0,qty:0,mat:DEFAULT_MAT}]}}
  var state=fresh();
  try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(p&&p.rows)state=p;}}catch(e){}

  var $=function(id){return document.getElementById(id)};
  var rowsEl=$("rows"),linesEl=$("lines");
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
  function money(n){return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
  function money0(n){return Math.abs(n-Math.round(n))<0.005?"$"+Math.round(n).toLocaleString("en-US"):money(n)}
  function sq(n){return n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  function calc(r){
    var sqft=num(r.w)*num(r.h)/144*num(r.qty);
    return {sqft:sqft,price:sqft*num(state.price),install:sqft*num(state.install)};
  }
  function line(r,c){
    return num(r.qty)+"pcs - "+r.file+" - "+num(r.w)+'"x'+num(r.h)+'" - '+r.mat+" - "+money0(c.price)+" "+state.tax;
  }

  function build(){
    rowsEl.innerHTML="";
    state.rows.forEach(function(r,i){
      var tr=document.createElement("tr");
      tr.innerHTML=
        '<td><input class="f" data-k="file" value="'+esc(r.file)+'"></td>'+
        '<td><input class="n" data-k="w" type="number" step="any" min="0" value="'+esc(r.w)+'"></td>'+
        '<td><input class="n" data-k="h" type="number" step="any" min="0" value="'+esc(r.h)+'"></td>'+
        '<td><input class="n" data-k="qty" type="number" step="1" min="0" value="'+esc(r.qty)+'"></td>'+
        '<td class="num" data-o="sqft"></td>'+
        '<td><input class="m" data-k="mat" value="'+esc(r.mat)+'"></td>'+
        '<td class="num" data-o="price"></td><td class="num" data-o="install"></td>'+
        '<td><button class="x" aria-label="Remove row" data-del="'+i+'">✕</button></td>';
      tr.addEventListener("input",function(e){var k=e.target.getAttribute("data-k");if(k){r[k]=e.target.value;update();}});
      tr.querySelector("[data-del]").addEventListener("click",function(){state.rows.splice(i,1);build();update();});
      rowsEl.appendChild(tr);
    });
  }

  function update(){
    var ts=0,tp=0,ti=0,html="";
    Array.prototype.forEach.call(rowsEl.children,function(tr,i){
      var r=state.rows[i],c=calc(r);
      tr.querySelector('[data-o="sqft"]').textContent=sq(c.sqft);
      tr.querySelector('[data-o="price"]').textContent=money(c.price);
      tr.querySelector('[data-o="install"]').textContent=money(c.install);
      ts+=c.sqft;tp+=c.price;ti+=c.install;
      html+="<p>"+esc(line(r,c))+"</p>";
    });
    $("tSqft").textContent=sq(ts);$("tPrice").textContent=money(tp);$("tInstall").textContent=money(ti);
    linesEl.innerHTML=html||"<p>Add a row to start a quote.</p>";
    renderSheet();
    save();
  }

  $("priceRate").value=state.price;$("installRate").value=state.install;$("taxNote").value=state.tax;
  $("priceRate").addEventListener("input",function(e){state.price=e.target.value;update()});
  $("installRate").addEventListener("input",function(e){state.install=e.target.value;update()});
  $("taxNote").addEventListener("input",function(e){state.tax=e.target.value;update()});
  $("add").addEventListener("click",function(){
    var last=state.rows[state.rows.length-1];
    state.rows.push({file:"",w:last?last.w:0,h:last?last.h:0,qty:0,mat:last?last.mat:DEFAULT_MAT});
    build();update();
    var inputs=rowsEl.querySelectorAll('input[data-k="file"]');inputs[inputs.length-1].focus();
  });
  var resetTimer=null;
  $("reset").addEventListener("click",function(){
    var b=$("reset");
    if(!resetTimer){
      b.textContent="Click again to clear everything";
      resetTimer=setTimeout(function(){b.textContent="Start over";resetTimer=null},4000);
      return;
    }
    clearTimeout(resetTimer);resetTimer=null;b.textContent="Start over";
    state=fresh();
    $("priceRate").value=state.price;$("installRate").value=state.install;$("taxNote").value=state.tax;
    build();update();
  });
  $("copy").addEventListener("click",function(){
    var text=state.rows.map(function(r){return line(r,calc(r))}).join("\n");
    var b=$("copy");
    function done(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy quote"},1500)}
    try{navigator.clipboard.writeText(text).then(done,function(){fallback(text,done)})}catch(e){fallback(text,done)}
  });
  function fallback(text,done){
    var t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();
    try{document.execCommand("copy");done()}catch(e){}
    document.body.removeChild(t);
  }

  function sheetData(){
    var head=["Artwork File Name","Width (inches)","Height (inches)","QTY","Sqft","Material"];
    var body=state.rows.map(function(r){
      var c=calc(r);
      return [r.file,String(num(r.w)),String(num(r.h)),String(num(r.qty)),sq(c.sqft),r.mat];
    });
    return {head:head,body:body};
  }
  function renderSheet(){
    var d=sheetData();
    var t=$("sheet");
    t.tHead.innerHTML="<tr>"+d.head.map(function(h,i){return "<th"+(i>=1&&i<=4?' class="num"':'')+">"+esc(h)+"</th>"}).join("")+"</tr>";
    t.tBodies[0].innerHTML=d.body.map(function(row){
      return "<tr>"+row.map(function(v,i){return "<td"+(i>=1&&i<=4?' class="num"':'')+">"+esc(v)+"</td>"}).join("")+"</tr>";
    }).join("");
  }
  $("copyTable").addEventListener("click",function(){
    var d=sheetData();
    var clean=function(v){return String(v).replace(/[\t\r\n]+/g," ")};
    var text=[d.head].concat(d.body).map(function(r){return r.map(clean).join("\t")}).join("\n");
    var b=$("copyTable");
    function done(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy table"},1500)}
    try{navigator.clipboard.writeText(text).then(done,function(){fallback(text,done)})}catch(e){fallback(text,done)}
  });
  build();update();
})();
</script>
</body>
</html>
